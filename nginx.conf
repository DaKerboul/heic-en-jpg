server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://stats.kerboul.me; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src blob: data:; worker-src 'self' blob:; connect-src 'self' https://stats.kerboul.me; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
